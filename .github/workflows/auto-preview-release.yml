name: Preview Release

on:
  push:
    branches: [ "main" ]
    # Build only when application code or build inputs change.
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app-process/src/**'
      - 'app-process/build.gradle.kts'
      - 'hidden-api/src/**'
      - 'hidden-api/build.gradle.kts'
      - 'baselineprofile/src/**'
      - 'baselineprofile/build.gradle.kts'
      - 'build-plugins/src/**'
      - 'build-plugins/build.gradle.kts'
      - 'build-plugins/settings.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/auto-preview-release.yml'
  workflow_dispatch:

jobs:
  build_and_prerelease:
    name: Build and Publish Preview
    # Skip preview release for version bumps or explicitly skipped commits
    if: |
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      !contains(github.event.head_commit.message, '[skip preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get commit short SHA & Date
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "YY_MM=$(date +'%y.%m')" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Accept the terms of use to suppress the caching licensing warning
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Main branch builds are allowed to update the cache
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode and set up signing key
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            exit 0
          fi
          mkdir -p keystore
          echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
          echo "storeFile=keystore/carlyu.jks" > keystore.properties
          echo "keyAlias=${SIGNING_KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${SIGNING_KEY_PASSWORD}" >> keystore.properties
          echo "storePassword=${SIGNING_STORE_PASSWORD}" >> keystore.properties

      - name: Build Preview Release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assemblePreviewRelease

      - name: Find and Rename Preview APKs
        id: rename_apks
        run: |
          PROJECT_NAME="InstallerX-Revived"
          # Pure version tag e.g., 26.03.1a2b3c4
          VERSION_TAG="${{ steps.vars.outputs.YY_MM }}.${{ steps.vars.outputs.SHORT_SHA }}"

          APK_DIR=$(find app/build/outputs/apk -type d | grep -iE '/preview/release$' | head -n 1)
          if [ -z "$APK_DIR" ]; then
            echo "ERROR: Preview APK output directory not found"
            ls -R app/build/outputs/apk
            exit 1
          fi
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Could not find the preview APK!"
            ls -R app/build/outputs/apk
            exit 1
          fi

          NEW_APK_NAME="${PROJECT_NAME}-online-${VERSION_TAG}.apk"
          NEW_APK_PATH="${APK_DIR}/${NEW_APK_NAME}"

          mv "$APK_PATH" "$NEW_APK_PATH"

          echo "apk=${NEW_APK_PATH}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT


    



      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID_1: ${{ secrets.CHAT_ID_1 }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
        shell: bash
        run: |
          ONLINE="${{ steps.rename_apks.outputs.online_apk }}"
          OFFLINE="${{ steps.rename_apks.outputs.offline_apk }}"


          echo "[+] Uploading Online APK to CHAT_ID_1..."
          curl -F chat_id="$CHAT_ID_1" \
               -F document=@"$ONLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

          echo "[+] Uploading Offline APK to CHAT_ID_1..."
          curl -F chat_id="$CHAT_ID_1" \
               -F document=@"$OFFLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

          echo "[+] Uploading Online APK to CHAT_ID_2..."
          curl -F chat_id="$CHAT_ID_2" \
               -F document=@"$ONLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

          echo "[+] Uploading Offline APK to CHAT_ID_2..."
          curl -F chat_id="$CHAT_ID_2" \
               -F document=@"$OFFLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
