name: Automatic Alpha Pre-Release (Latest Only)

on:
  push:
    branches: [ "main" ]
    # Only trigger on specific path changes
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/auto-preview-release.yml'
  workflow_dispatch:

jobs:
  build_and_prerelease:
    # Skip preview release for version bumps or explicitly skipped commits
    if: |
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      !contains(github.event.head_commit.message, '[skip preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get commit short SHA & Date
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "YY_MM=$(date +'%y.%m')" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Accept the terms of use to suppress the caching licensing warning
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Main branch builds are allowed to update the cache
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode and set up signing key
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            exit 0
          fi
          mkdir -p keystore
          echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
          echo "storeFile=keystore/carlyu.jks" > keystore.properties
          echo "keyAlias=${SIGNING_KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${SIGNING_KEY_PASSWORD}" >> keystore.properties
          echo "storePassword=${SIGNING_STORE_PASSWORD}" >> keystore.properties

      - name: Build Preview Release APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleOnlinePreviewRelease assembleOfflinePreviewRelease

      - name: Find and Rename Preview APKs
        id: rename_apks
        run: |
          PROJECT_NAME="InstallerX-Revived"
          # Pure version tag e.g., 26.03.1a2b3c4
          VERSION_TAG="${{ steps.vars.outputs.YY_MM }}.${{ steps.vars.outputs.SHORT_SHA }}"

          ONLINE_APK_DIR="app/build/outputs/apk/onlinePreview/release/"
          OFFLINE_APK_DIR="app/build/outputs/apk/offlinePreview/release/"

          ONLINE_APK_PATH=$(find "$ONLINE_APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          OFFLINE_APK_PATH=$(find "$OFFLINE_APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$ONLINE_APK_PATH" ] || [ -z "$OFFLINE_APK_PATH" ]; then
            echo "ERROR: Could not find both APKs!"
            ls -R app/build/outputs/apk
            exit 1
          fi

          NEW_ONLINE_APK_NAME="${PROJECT_NAME}-online-${VERSION_TAG}.apk"
          NEW_OFFLINE_APK_NAME="${PROJECT_NAME}-offline-${VERSION_TAG}.apk"

          NEW_ONLINE_APK_PATH="${ONLINE_APK_DIR}${NEW_ONLINE_APK_NAME}"
          NEW_OFFLINE_APK_PATH="${OFFLINE_APK_DIR}${NEW_OFFLINE_APK_NAME}"

          mv "$ONLINE_APK_PATH" "$NEW_ONLINE_APK_PATH"
          mv "$OFFLINE_APK_PATH" "$NEW_OFFLINE_APK_PATH"

          echo "online_apk=${NEW_ONLINE_APK_PATH}" >> $GITHUB_OUTPUT
          echo "offline_apk=${NEW_OFFLINE_APK_PATH}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT


    



      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID_1: ${{ secrets.CHAT_ID_1 }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
        shell: bash
        run: |
          ONLINE="${{ steps.rename_apks.outputs.online_apk }}"
          OFFLINE="${{ steps.rename_apks.outputs.offline_apk }}"


          echo "[+] Uploading Online APK to CHAT_ID_1..."
          curl -F chat_id="$CHAT_ID_1" \
               -F document=@"$ONLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

          echo "[+] Uploading Offline APK to CHAT_ID_1..."
          curl -F chat_id="$CHAT_ID_1" \
               -F document=@"$OFFLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

          echo "[+] Uploading Online APK to CHAT_ID_2..."
          curl -F chat_id="$CHAT_ID_2" \
               -F document=@"$ONLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

          echo "[+] Uploading Offline APK to CHAT_ID_2..."
          curl -F chat_id="$CHAT_ID_2" \
               -F document=@"$OFFLINE" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
